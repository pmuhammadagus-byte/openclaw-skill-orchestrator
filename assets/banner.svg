<svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a33"/>
      <stop offset="100%" stop-color="#1b2a4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#ff7a59"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- decorative node network -->
  <g stroke="#ffb347" stroke-opacity="0.22" stroke-width="1.5">
    <line x1="930" y1="90" x2="1060" y2="160"/>
    <line x1="1060" y1="160" x2="980" y2="270"/>
    <line x1="980" y1="270" x2="1110" y2="300"/>
    <line x1="930" y1="90" x2="980" y2="270"/>
    <line x1="1060" y1="160" x2="1110" y2="300"/>
  </g>
  <g fill="#ffb347" fill-opacity="0.85">
    <circle cx="930" cy="90" r="7"/>
    <circle cx="1060" cy="160" r="9"/>
    <circle cx="980" cy="270" r="7"/>
    <circle cx="1110" cy="300" r="6"/>
  </g>

  <!-- lobster mark -->
  <text x="90" y="210" font-size="140" fill="url(#accent)">🦞</text>

  <!-- title -->
  <text x="280" y="185" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="-1">Skill Orchestrator</text>
  <text x="283" y="245" font-size="30" fill="#ffb347" font-weight="bold">Clara Edition</text>
  <text x="283" y="295" font-size="22" fill="#aab4cc">Keep your workspace skills audited, conflict-free &amp; secret-safe.</text>

  <!-- divider -->
  <rect x="283" y="325" width="560" height="4" rx="2" fill="url(#accent)"/>
  <text x="283" y="365" font-size="16" fill="#7f8aa3">audit · validate · conflict-detect · health · auto-fix</text>
</svg>
